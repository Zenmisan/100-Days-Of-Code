<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FinTech Calc | Day 14</title>
    <link rel="stylesheet" href="/Day%2013/style.css">
    <link rel="icon" href="/zenmi.svg" type="image/svg+xml">
</head>
<body>
    <a href="/day20" class="back-btn">← Home</a>

    <div class="calculator-card">
        <h2>Interest Estimator</h2>
        
        <div class="input-group">
            <label>Principal Amount (₦)</label>
            <input type="number" id="principal" placeholder="e.g. 50000">
        </div>

        <div class="input-group">
            <label>Interest Rate (%)</label>
            <input type="number" id="rate" placeholder="e.g. 12.5">
        </div>

        <div class="input-group">
            <label>Time (Years)</label>
            <input type="number" id="years" placeholder="e.g. 5">
        </div>

        <button id="calc-btn">Calculate Return</button>

        <div class="result-display">
            <h3>Total Value:</h3>
            <h1 id="total-output">₦ 0.00</h1>
        </div>
    </div>

    <script src="/Day%2013/script.js"></script>
</body>
</html>
