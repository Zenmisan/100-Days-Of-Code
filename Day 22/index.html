<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/zenmi.svg">
    <title>Day 22: Modules</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #27ae60; }
        #output { margin-top: 20px; font-size: 1.5rem; text-align: center; color: #333; }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 2px 8px rgba(46, 204, 113, 0.2);
            transition: all 0.2s;
            z-index: 1000;
        }
        .back-btn:hover { background: #27ae60; transform: translateY(-2px); }
    </style>
</head>
<body>
    <a href="/day20" class="back-btn">← Home</a>

    <div class="card">
        <h2>Circle Geometry</h2>
        <label>Radius (r)</label>
        <input type="number" id="radius" placeholder="Enter radius...">
        
        <button id="calc-area">Calculate Area</button>
        <button id="calc-circ" style="background:#3498db; margin-top:5px;">Calculate Circumference</button>

        <div id="output">Result: --</div>
    </div>

    <script type="module" src="/Day%2022/main.js"></script>

</body>
</html>
