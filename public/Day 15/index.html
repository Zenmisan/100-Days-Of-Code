<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 15 Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/zenmi.svg" type="image/svg+xml">
</head>
<body>
    <a href="/Day 20/index.html" style="position: fixed; top: 20px; left: 20px; padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 5px; font-family: sans-serif; z-index: 1000;">← Home</a>

    <div class="card">
        
        <form id="login-form">
            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your details.</p>

            <div class="input-group">
                <label for="username">Username / Email</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit">Log In</button>
        </form>

        <div id="success-message" class="hidden">
            <div class="smiley">🙂</div>
            <h2 id="welcome-text">You logged in!</h2>
            <p>It works.</p>
            <button id="logout-btn" class="secondary-btn">Log Out</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
